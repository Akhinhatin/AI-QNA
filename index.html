<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Q&A Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        #chat-container { width: 400px; margin: 50px auto; background: #fff; border-radius: 5px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        #chat-box { height: 300px; overflow-y: auto; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        #user-input { padding: 10px; border: none; width: 70%; }
        #send-btn { padding: 10px; border: none; background: #007BFF; color: white; cursor: pointer; width: 28%; }
        #send-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Type your question..." />
        <button id="send-btn">Send</button>
    </div>
    <script>
        const sendButton = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        sendButton.addEventListener('click', () => {
            const userMessage = userInput.value;
            chatBox.innerHTML += `<p>You: ${userMessage}</p>`;
            userInput.value = '';

            fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer YOUR_OPENAI_API_KEY'
                },
                body: JSON.stringify({
                    model: 'gpt-3.5-turbo',
                    messages: [{ role: 'user', content: userMessage }]
                })
            })
            .then(response => response.json())
            .then(data => {
                const aiMessage = data.choices[0].message.content;
                chatBox.innerHTML += `<p>ChatGPT: ${aiMessage}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
